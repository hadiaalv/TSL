<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · The Social Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20261015-light-theme" />
  <link rel="stylesheet" href="/static/login.css?v=20261015-light-theme" />
  <link rel="icon" type="image/png" href="/public/logo.png" />
  <link rel="apple-touch-icon" href="/public/logo.png" />
</head>
<body class="login-body">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-mark">TSL</span>
        <div>
          <div class="brand-name">The Social Links</div>
          <div class="brand-sub">Your team workspace</div>
        </div>
      </div>

      <h1>Welcome back</h1>
      <p class="login-lede">Sign in to continue to your workspace.</p>

      <form id="login-form" class="login-form" autocomplete="on">
        <label>
          Username
          <input id="username" name="username" type="text" required autocomplete="username" autofocus />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </label>
        <button type="submit" id="login-btn">Sign in</button>
        <p id="login-error" class="login-error" hidden></p>
      </form>
    </div>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
